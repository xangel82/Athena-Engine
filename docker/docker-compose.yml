# Athena's Engine on a single NVIDIA GB10.
# Set ATHENA_MODELS_DIR to the folder with the model files:
#   ATHENA_MODELS_DIR=/path/to/models docker compose up -d
#
# The image is set up for DeepSeek V4 Flash.  To run another model, or
# several, uncomment one of the environment blocks below.
services:
  athena-engine:
    image: ghcr.io/xangel82/athena-engine:1.0.2
    container_name: athena-engine
    restart: unless-stopped
    # A small init reaps what the processes leave behind and passes docker's
    # stop on; the engine then has the time to stop it has under systemd.
    init: true
    stop_grace_period: 3m
    ports:
      - "30007:30007"
      # The system companion (docs/sentinel.md), for this machine only: an
      # HTTPS proxy on it publishes it under /system/.
      - "127.0.0.1:30010:30010"
    # What the engine runs is yours to choose.  The image starts DeepSeek
    # V4 Flash; uncomment one of these blocks for Qwen3.8 Flash Next, for
    # DeepSeek V4 Flash Vision-Exp, for DeepSeek V4.1 Flash, or for several
    # — then a conversation switches between them by writing "%switch qwen",
    # "%switch deepseek", "%switch visio" or "%switch deepseek4.1".
    #
    # Qwen3.8 Flash Next instead, NVIDIA's FP4-Local as install.sh converts
    # it (the models are mounted read-only, so convert them on the host
    # first: install.sh --model qwen, or install.sh --convert DIR):
    # environment:
    #   ATHENA_MODEL: /models/qwen-fp4/Qwen3.8-Flash-Next-FP4-Local.gguf
    #   ATHENA_DRAFT: /models/qwen-fp4/Qwen3.8-Flash-Next-FP4-Local-MTP.gguf
    #   ATHENA_MMPROJ: /models/qwen/MMPROJ/mmproj-F16.gguf
    #
    # or Unsloth's IQ4_XS GGUF of it (install.sh --model qwen-iq4):
    # environment:
    #   ATHENA_MODEL: /models/qwen/UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf
    #   ATHENA_DRAFT: /models/qwen/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
    #   ATHENA_MMPROJ: /models/qwen/MMPROJ/mmproj-F16.gguf
    #
    # DeepSeek V4 Flash Vision-Exp instead, the DeepSeek that reads images:
    # environment:
    #   ATHENA_MODEL: /models/DeepSeek-V4-Flash-Vision-Exp-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8.gguf
    #   ATHENA_DRAFT: /models/DeepSeek-V4-Flash-Vision-Exp-DSpark-support.gguf
    #   ATHENA_MMPROJ: /models/DeepSeek-V4-Flash-Vision-Encoder.gguf
    #
    # DeepSeek V4.1 Flash instead, larger than the machine and read from the
    # SSD the models folder is on — keep that folder on a fast local drive:
    # environment:
    #   ATHENA_MODEL: /models/DeepSeek-V4.1-Flash-1017-IQ2_XXS-Q2_K-imatrix.gguf
    #
    # All three, switchable while it runs, and V4.1 too if you have it:
    # environment:
    #   ATHENA_MODEL: /models/qwen-fp4/Qwen3.8-Flash-Next-FP4-Local.gguf
    #   ATHENA_DRAFT: /models/qwen-fp4/Qwen3.8-Flash-Next-FP4-Local-MTP.gguf
    #   ATHENA_MMPROJ: /models/qwen/MMPROJ/mmproj-F16.gguf
    #   ATHENA_MODEL_2: /models/DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix-0731.gguf
    #   ATHENA_DRAFT_2: /models/DeepSeek-V4-Flash-DSpark-IQ2XXS-Q2K-Q8.gguf
    #   ATHENA_MODEL_3: /models/DeepSeek-V4-Flash-Vision-Exp-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8.gguf
    #   ATHENA_DRAFT_3: /models/DeepSeek-V4-Flash-Vision-Exp-DSpark-support.gguf
    #   ATHENA_MMPROJ_3: /models/DeepSeek-V4-Flash-Vision-Encoder.gguf
    #   ATHENA_MODEL_4: /models/DeepSeek-V4.1-Flash-1017-IQ2_XXS-Q2_K-imatrix.gguf
    #
    # Voice beside any of these blocks: add to its environment the speech
    # models install.sh converts, and the engine speaks (/v1/audio/speech) and
    # listens (/v1/audio/transcriptions), loading each at its first request:
    #   ATHENA_TTS_MODEL: /models/voice/Qwen3-TTS-12Hz-1.7B-Base-Q8_0.gguf
    #   ATHENA_ASR_MODEL: /models/voice/Qwen3-ASR-1.7B-Q8_0.gguf
    #
    # Search (/v1/embeddings, /v1/rerank) and video (/v1/videos) the same
    # way, with what install.sh --rag and --video convert; the first
    # embedding model is the default, the other is asked for by name:
    #   ATHENA_EMBEDDING_MODEL: /models/retrieval/embeddinggemma-2-mm-BF16.gguf:/models/retrieval/Qwen3-Embedding-0.6B-Q8_0.gguf
    #   ATHENA_RERANK_MODEL: /models/retrieval/Qwen3-Reranker-0.6B-Q8_0.gguf
    #   ATHENA_VIDEO_MODEL_DIR: /models/video
    #
    # An API key every client must send (Authorization: Bearer KEY, or
    # x-api-key: KEY), taken here from the shell compose runs in; several,
    # one per client, separated by commas.  The health check below needs none.
    #   ATHENA_API_KEY: ${ATHENA_API_KEY}
    volumes:
      - ${ATHENA_MODELS_DIR:?set ATHENA_MODELS_DIR}:/models:ro
      - athena-kv:/kv
      - athena-state:/state
    ulimits:
      memlock: -1
    # The engine answers /health once the model is loaded, which on a model
    # of this size takes about a minute; until then the container is still
    # starting, not unhealthy.  Probed with bash alone, so the image needs
    # no extra packages.
    healthcheck:
      test: ["CMD", "bash", "-c",
             "exec 3<>/dev/tcp/127.0.0.1/30007 && printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  athena-kv:
  athena-state:
