# Athena's Engine on a single NVIDIA GB10.
# Set ATHENA_MODELS_DIR to the folder with the model files:
#   ATHENA_MODELS_DIR=/path/to/models docker compose up -d
#
# The image is set up for DeepSeek V4 Flash.  To run Qwen3.8 Flash Next
# instead, uncomment the environment block below.
services:
  athena-engine:
    image: ghcr.io/xangel82/athena-engine:0.1.0
    container_name: athena-engine
    restart: unless-stopped
    ports:
      - "30007:30007"
    # What the engine runs is yours to choose.  The image starts DeepSeek
    # V4 Flash; uncomment one of these blocks for Qwen3.8 Flash Next, or
    # for both — with both, a conversation switches between them by
    # writing "%switch qwen" or "%switch deepseek".
    #
    # Qwen3.8 Flash Next instead:
    # environment:
    #   ATHENA_MODEL: /models/UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf
    #   ATHENA_DRAFT: /models/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
    #   ATHENA_MMPROJ: /models/MMPROJ/mmproj-F16.gguf
    #
    # Both, switchable while it runs:
    # environment:
    #   ATHENA_MODEL: /models/UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf
    #   ATHENA_DRAFT: /models/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
    #   ATHENA_MMPROJ: /models/MMPROJ/mmproj-F16.gguf
    #   ATHENA_MODEL_2: /models/DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix-0731.gguf
    #   ATHENA_DRAFT_2: /models/DeepSeek-V4-Flash-DSpark-IQ2XXS-Q2K-Q8.gguf
    volumes:
      - ${ATHENA_MODELS_DIR:?set ATHENA_MODELS_DIR}:/models:ro
      - athena-kv:/kv
      - athena-state:/state
    ulimits:
      memlock: -1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  athena-kv:
  athena-state:
